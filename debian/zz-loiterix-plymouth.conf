# Keep serial consoles on the kernel cmdline, but tell Plymouth not to
# fall back to the text "details" theme when console=ttyAS0 is present.
# Sourced after radxa.conf (zz- sorts after radxa).
if [ -n "${U_BOOT_PARAMETERS}" ]; then
	case " ${U_BOOT_PARAMETERS} " in
	*" plymouth.ignore-serial-consoles "*) ;;
	*) U_BOOT_PARAMETERS="${U_BOOT_PARAMETERS} plymouth.ignore-serial-consoles" ;;
	esac
fi
